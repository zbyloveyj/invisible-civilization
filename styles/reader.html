<script>
(()=>{if(!document.querySelector('.novel-chapter'))return;const root=document.documentElement;const key='invisible-civilization-reader-size';let s=Number(localStorage.getItem(key)||1);if(!Number.isFinite(s))s=1;s=Math.min(1.25,Math.max(.85,s));function apply(){root.style.setProperty('--reader-size',String(s))}apply();const progress=document.createElement('div');progress.className='reader-progress';progress.setAttribute('aria-hidden','true');document.body.append(progress);const bar=document.createElement('div');bar.className='reader-controls';bar.setAttribute('aria-label','阅读字号');bar.innerHTML='<button type="button" aria-label="缩小字号">A−</button><button type="button" aria-label="放大字号">A＋</button>';bar.querySelectorAll('button').forEach((b,i)=>b.addEventListener('click',()=>{s=Math.min(1.25,Math.max(.85,Math.round((s+(i?0.05:-0.05))*100)/100));apply();localStorage.setItem(key,String(s))}));document.body.append(bar);let f=false;function draw(){f=false;const max=document.documentElement.scrollHeight-innerHeight;progress.style.width=(max>0?Math.max(0,Math.min(100,100*scrollY/max)):0)+'%'}window.addEventListener('scroll',()=>{if(!f){f=true;requestAnimationFrame(draw)}},{passive:true});window.addEventListener('resize',draw,{passive:true});draw()})();
</script>
