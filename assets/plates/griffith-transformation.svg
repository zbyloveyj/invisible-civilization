<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="t d"><title id="t">格里菲思细菌转化实验</title><desc id="d">用1928年肺炎链球菌研究作为依据的现代概念图；R 型和 S 型与小鼠实验结果的关系简化示意。</desc><rect width="1080" height="620" fill="#f6f3eb"/><rect x="34" y="34" width="1012" height="552" fill="none" stroke="#d4d4c8" stroke-width="1"/><text x="73" y="80" font-family="Georgia, serif" font-size="19" letter-spacing="4" fill="#597267">THE INVISIBLE · SCIENTIFIC PLATES</text><line x1="74" y1="96" x2="1006" y2="96" stroke="#d4d4c8" stroke-width="1"/><text x="74" y="559" font-family="sans-serif" font-size="15" letter-spacing="1.4" fill="#69756c">作者绘制的现代解释图 · 非原始历史实验记录</text><text x="92" y="142" font-family="serif" font-size="28" fill="#2b3430">某些已失活的细菌材料，为什么仍能改变活菌？</text><line x1="90" y1="275" x2="984" y2="275" stroke="#d4d4c8"/><text x="95" y="198" font-family="sans-serif" font-size="22" fill="#2b3430">活 S 型</text><text x="95" y="228" font-family="sans-serif" font-size="17" fill="#647268">具有荚膜的菌株</text><g><g transform="translate(550 208)"><rect x="-24" y="-8" width="49" height="16" rx="8" fill="#597267" opacity=".93"/><path d="M-20 0H22" stroke="#f6f3eb" stroke-width="1" stroke-dasharray="3 5"/></g><g transform="translate(610 208)"><rect x="-24" y="-8" width="49" height="16" rx="8" fill="#597267" opacity=".93"/><path d="M-20 0H22" stroke="#f6f3eb" stroke-width="1" stroke-dasharray="3 5"/></g><g transform="translate(670 208)"><rect x="-24" y="-8" width="49" height="16" rx="8" fill="#597267" opacity=".93"/><path d="M-20 0H22" stroke="#f6f3eb" stroke-width="1" stroke-dasharray="3 5"/></g></g><text x="951" y="220" text-anchor="end" fill="#a07359" font-size="22" font-family="sans-serif">小鼠死亡</text><line x1="90" y1="375" x2="984" y2="375" stroke="#d4d4c8"/><text x="95" y="298" font-family="sans-serif" font-size="22" fill="#2b3430">活 R 型</text><text x="95" y="328" font-family="sans-serif" font-size="17" fill="#647268">无荚膜的菌株</text><g><g transform="translate(550 308)"><rect x="-24" y="-8" width="49" height="16" rx="8" fill="#a07359" opacity=".93"/><path d="M-20 0H22" stroke="#f6f3eb" stroke-width="1" stroke-dasharray="3 5"/></g><g transform="translate(610 308)"><rect x="-24" y="-8" width="49" height="16" rx="8" fill="#a07359" opacity=".93"/><path d="M-20 0H22" stroke="#f6f3eb" stroke-width="1" stroke-dasharray="3 5"/></g><g transform="translate(670 308)"><rect x="-24" y="-8" width="49" height="16" rx="8" fill="#a07359" opacity=".93"/><path d="M-20 0H22" stroke="#f6f3eb" stroke-width="1" stroke-dasharray="3 5"/></g></g><text x="951" y="320" text-anchor="end" fill="#597267" font-size="22" font-family="sans-serif">小鼠存活</text><line x1="90" y1="475" x2="984" y2="475" stroke="#d4d4c8"/><text x="95" y="398" font-family="sans-serif" font-size="22" fill="#2b3430">加热杀死的 S 型</text><text x="95" y="428" font-family="sans-serif" font-size="17" fill="#647268">不再具有活性的菌体</text><g><g transform="translate(550 408)"><rect x="-24" y="-8" width="49" height="16" rx="8" fill="#597267" opacity=".93"/><path d="M-20 0H22" stroke="#f6f3eb" stroke-width="1" stroke-dasharray="3 5"/></g><g transform="translate(610 408)"><rect x="-24" y="-8" width="49" height="16" rx="8" fill="#597267" opacity=".93"/><path d="M-20 0H22" stroke="#f6f3eb" stroke-width="1" stroke-dasharray="3 5"/></g><g transform="translate(670 408)"><rect x="-24" y="-8" width="49" height="16" rx="8" fill="#597267" opacity=".93"/><path d="M-20 0H22" stroke="#f6f3eb" stroke-width="1" stroke-dasharray="3 5"/></g></g><text x="951" y="420" text-anchor="end" fill="#597267" font-size="22" font-family="sans-serif">小鼠存活</text><line x1="90" y1="575" x2="984" y2="575" stroke="#d4d4c8"/><text x="95" y="498" font-family="sans-serif" font-size="22" fill="#2b3430">失活 S 型 ＋ 活 R 型</text><text x="95" y="528" font-family="sans-serif" font-size="17" fill="#647268">出现可转化的遗传表型</text><g><g transform="translate(550 508)"><rect x="-24" y="-8" width="49" height="16" rx="8" fill="#a07359" opacity=".93"/><path d="M-20 0H22" stroke="#f6f3eb" stroke-width="1" stroke-dasharray="3 5"/></g><g transform="translate(610 508)"><rect x="-24" y="-8" width="49" height="16" rx="8" fill="#a07359" opacity=".93"/><path d="M-20 0H22" stroke="#f6f3eb" stroke-width="1" stroke-dasharray="3 5"/></g><g transform="translate(670 508)"><rect x="-24" y="-8" width="49" height="16" rx="8" fill="#a07359" opacity=".93"/><path d="M-20 0H22" stroke="#f6f3eb" stroke-width="1" stroke-dasharray="3 5"/></g></g><text x="951" y="520" text-anchor="end" fill="#a07359" font-size="22" font-family="sans-serif">回收活 S 型</text><text x="690" y="168" font-size="13" font-family="sans-serif" fill="#a07359">实验逻辑复原示意</text></svg>