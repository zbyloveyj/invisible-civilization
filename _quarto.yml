project:
  type: book
  output-dir: _site
  resources:
    - assets/**
    - downloads/**

lang: zh-CN
number-sections: false

book:
  title: "看不见的文明"
  subtitle: "微生物与人类的三百年"
  author: "一心问道"
  favicon: assets/favicon.svg
  site-url: "https://zbyloveyj.github.io/invisible-civilization/"
  page-navigation: true
  navbar:
    title: 看不见的文明
    search: true
    pinned: true
    collapse-below: lg
    left:
      - text: 首页
        href: index.qmd
      - text: 六卷目录
        href: contents.qmd
      - text: 科学年表
        href: timeline.qmd
      - text: 科学图版
        href: figures.qmd
      - text: 关于作者
        href: about.qmd
      - text: 下载
        href: download.qmd
    right:
      - icon: github
        href: https://github.com/zbyloveyj/invisible-civilization
        aria-label: GitHub 仓库
  sidebar:
    title: 六卷 · 四十八章
    style: docked
    collapse-level: 1
  search:
    location: navbar
    type: overlay
    limit: 12
  page-footer:
    left: "© 2026 一心问道 · 保留所有权利"
    right:
